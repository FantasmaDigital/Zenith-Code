services:
  # ==========================================================
  # 1. ASISTENTE OPERATIVO IA (FASTAPI + GEMINI / OPENAI)
  # ==========================================================
  python-backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: zenith-python-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - COMPANY_NAME=${COMPANY_NAME:-Fantasma Digital}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:3000
      - DATABASE_URL=postgresql://zenith:${POSTGRES_PASSWORD:-zenith_password_2026}@postgres:5432/zenith_knowledge
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-False}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Invitaciones de usuarios: URL del panel en los enlaces y correo saliente (SMTP)
      - PANEL_URL=${PANEL_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
    volumes:
      - ./backend-python:/app
    depends_on:
      - postgres
    networks:
      - zenith-net

  # ==========================================================
  # 2. MICROSERVICIO IN-HOUSE DE WHATSAPP (BAILEYS MULTI-DEVICE)
  # ==========================================================
  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
      dockerfile: Dockerfile
    container_name: zenith-whatsapp-gateway
    restart: unless-stopped
    ports:
      # Solo accesible desde el propio servidor; el backend lo usa por la red interna de Docker
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - AUTH_FOLDER=/app/auth_info_baileys
      - LOG_LEVEL=info
      - INITIAL_RECONNECT_DELAY_MS=2000
      - MAX_RECONNECT_DELAY_MS=30000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
      # Empresa a la que pertenece este número de WhatsApp (ver MULTI-EMPRESA en README)
      - TENANT_ID=${TENANT_ID:-default}
    volumes:
      - ./whatsapp-gateway/src:/app/src
      - baileys_auth_data:/app/auth_info_baileys
    depends_on:
      - python-backend
    networks:
      - zenith-net

  # ----------------------------------------------------------
  # Ejemplo: segundo número de WhatsApp para otra empresa (descomenta y ajusta).
  # (agrega también el volumen baileys_auth_data_acme en la sección volumes)
  # En el panel, esa empresa debe tener WHATSAPP_GATEWAY_URL=http://whatsapp-gateway-acme:3000
  # ----------------------------------------------------------
  # whatsapp-gateway-acme:
  #   build:
  #     context: ./whatsapp-gateway
  #     dockerfile: Dockerfile
  #   container_name: zenith-whatsapp-gateway-acme
  #   restart: unless-stopped
  #   environment:
  #     - PORT=3000
  #     - HOST=0.0.0.0
  #     - PYTHON_BACKEND_URL=http://python-backend:8000
  #     - AUTH_FOLDER=/app/auth_info_baileys
  #     - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
  #     - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
  #     - TENANT_ID=acme
  #   volumes:
  #     - ./whatsapp-gateway/src:/app/src
  #     - baileys_auth_data_acme:/app/auth_info_baileys
  #   depends_on:
  #     - python-backend
  #   networks:
  #     - zenith-net

  # ==========================================================
  # 3. BASE DE DATOS POSTGRESQL (PERSISTENCIA Y ALTA ESCALA)
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: zenith-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zenith
      # Ojo: si el volumen ya existe, cambiar esta variable NO cambia la contraseña de la BD
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zenith_password_2026}
      - POSTGRES_DB=zenith_knowledge
    # Sin puertos publicados: solo el backend accede por la red interna de Docker.
    # Para inspeccionar desde tu máquina usa: docker compose exec postgres psql -U zenith zenith_knowledge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zenith-net

  # ==========================================================
  # 4. INTERFAZ WEB / DASHBOARD (REACT + VITE)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zenith-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - python-backend
    networks:
      - zenith-net

networks:
  zenith-net:
    driver: bridge

volumes:
  baileys_auth_data:
    name: zenith_baileys_auth_data
  postgres_data:
    name: zenith_postgres_data
