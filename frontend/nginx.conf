server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sin listado de carpetas ni cuerpos enormes fuera de la API
    autoindex off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # __API_ORIGIN__ se reemplaza en el build (Dockerfile.prod) por la URL pública del backend.
    # Las cabeceras se repiten en cada location porque add_header de un location anula las del server.
    set $csp "default-src 'self'; script-src 'self' https://www.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' __API_ORIGIN__ https://www.paypal.com https://www.sandbox.paypal.com https://api-m.paypal.com https://api-m.sandbox.paypal.com; frame-src 'self' data: blob: https://www.paypal.com https://www.sandbox.paypal.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    # Proxy a la API: el panel llama a /backend/... en su mismo dominio (sin CORS).
    # Con variable + resolver, nginx arranca aunque el backend aún no exista y re-resuelve su IP.
    # Archivos ocultos (.git, .env, etc.) nunca se sirven
    location ~ /\. {
        deny all;
        return 404;
    }

    location /backend/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream "${BACKEND_URL}";
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        client_max_body_size 50m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;  # el pago de PayPal abre una ventana emergente
        add_header X-Permitted-Cross-Domain-Policies none always;
    }
}
