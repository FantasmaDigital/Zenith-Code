# CI en cada push y pull request; CD (imágenes a GHCR + redeploy en EasyPanel) solo al llegar a main.
# Configuración necesaria en GitHub → Settings → Environments → «production» (ver DEPLOY_EASYPANEL.md):
#   Secrets:   EASYPANEL_WEBHOOK_BACKEND, EASYPANEL_WEBHOOK_GATEWAY, EASYPANEL_WEBHOOK_FRONTEND
#   Variables: API_DOMAIN (ej. api.tudominio.com)
# Las variables de entorno de producción viven SOLO en EasyPanel (nunca en GitHub).
name: CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    env:
      # Valores solo de prueba; la BD es SQLite temporal (sin DATABASE_URL)
      DEBUG: "False"
      ADMIN_PASSWORD: ci-admin-password
      INTERNAL_API_KEY: ci-internal-key
      AUTH_SECRET: ci-auth-secret
      DATABASE_URL: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-python/requirements.txt
      - run: pip install -r requirements.txt httpx
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -t .

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gateway:
    name: WhatsApp gateway · instalación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp-gateway/package-lock.json
      - run: npm ci --omit=dev
      - run: for f in $(find src -name '*.js'); do node --check "$f"; done

  audit:
    name: Auditoría de dependencias (informativa)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r backend-python/requirements.txt
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: whatsapp-gateway

  docker:
    name: Docker · build${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' y push' || '' }}
    needs: [backend, frontend, gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend-python
          file: backend-python/Dockerfile.prod
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: WhatsApp gateway
        uses: docker/build-push-action@v6
        with:
          context: whatsapp-gateway
          file: whatsapp-gateway/Dockerfile.prod
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/whatsapp-gateway:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/whatsapp-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: ${{ env.PUSH == 'true' }}
          # El panel llama a la API por su mismo dominio (/backend, proxy de nginx): sin CORS
          build-args: VITE_API_BASE=/backend
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Despliegue en EasyPanel
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Cada servicio de EasyPanel usa la imagen :latest de GHCR; su webhook lo hace descargarla y reiniciar.
      # Orden: backend primero (migra tablas), luego el gateway y al final el panel.
      - name: Redeploy backend
        run: curl -fsS -X POST "${{ secrets.EASYPANEL_WEBHOOK_BACKEND }}"
      - name: Esperar a que el backend arranque
        run: sleep 45
      - name: Redeploy WhatsApp gateway
        run: curl -fsS -X POST "${{ secrets.EASYPANEL_WEBHOOK_GATEWAY }}"
      - name: Redeploy panel
        run: curl -fsS -X POST "${{ secrets.EASYPANEL_WEBHOOK_FRONTEND }}"
      - name: Comprobar la API pública
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/health"; then exit 0; fi
            sleep 10
          done
          echo "La API no respondió en https://${{ vars.API_DOMAIN }}/health" && exit 1
